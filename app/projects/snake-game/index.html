<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake — Classic Arcade</title>
<style>
  :root {
    --bg: #0b0d10;
    --surface: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.1);
    --text: #e2e6e3;
    --muted: rgba(226,230,227,.55);
    --accent: #711BFF;
    --accent-2: #9d6bff;
    --food: #ff5470;
    --snake: #3ddc97;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 16px; gap: 14px;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .hud {
    display: flex; align-items: center; gap: 10px; width: min(92vw, 560px);
  }
  .stat {
    flex: 1; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 16px;
  }
  .stat .label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .stat .value { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat.best .value { color: var(--accent-2); }
  .icon-btn {
    width: 46px; height: 58px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-size: 18px; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, transform .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.1); }
  .icon-btn:active { transform: scale(.94); }
  .board-wrap {
    position: relative; width: min(92vw, 560px, calc(100dvh - 260px));
    aspect-ratio: 1; border-radius: 20px; overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.02);
  }
  canvas { display: block; width: 100%; height: 100%; background: #0e1116; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(8,9,12,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    padding: 24px; transition: opacity .3s; z-index: 5;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: -0.02em; }
  .overlay h1 .accent { color: var(--snake); }
  .overlay p { color: var(--muted); font-size: 14px; max-width: 34ch; line-height: 1.6; }
  .overlay .big-score { font-size: 52px; font-weight: 900; color: var(--snake); font-variant-numeric: tabular-nums; }
  .overlay .new-best {
    color: var(--accent-2); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .btn {
    padding: 14px 34px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font: 700 16px system-ui, sans-serif;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s;
    box-shadow: 0 10px 34px rgba(113,27,255,.4);
  }
  .btn:hover, .btn:focus-visible { background: var(--accent-2); transform: scale(1.05); outline: none; }
  .btn:active { transform: scale(.96); }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  kbd {
    background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 3px 9px; font: 600 11px system-ui; color: var(--muted);
  }
  /* on-screen d-pad (touch only) */
  .dpad { display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 6px; }
  .dpad button {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 16px; font-size: 20px; cursor: pointer; transition: background .15s;
  }
  .dpad button:active { background: var(--accent); }
  .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
  @media (pointer: coarse) { .dpad { display: grid; } .keys { display: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .new-best { animation: none; } .btn, .icon-btn { transition: none; } }
</style>
</head>
<body>

<div class="hud" role="status" aria-live="polite">
  <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="stat best"><div class="label">Best</div><div class="value" id="best">0</div></div>
  <button class="icon-btn" id="pauseBtn" aria-label="Pause or resume" title="Pause (Space)">⏸</button>
  <button class="icon-btn" id="muteBtn" aria-label="Toggle sound" title="Sound">🔊</button>
</div>

<div class="board-wrap">
  <canvas id="game" aria-label="Snake game board"></canvas>

  <div class="overlay" id="startOverlay">
    <h1>SNAKE<span class="accent">.</span></h1>
    <p>Eat the berries, don't eat yourself. Speed ramps up as you grow.</p>
    <button class="btn" id="startBtn">Play</button>
    <div class="keys"><kbd>↑↓←→</kbd><kbd>WASD</kbd><kbd>Space</kbd> pause</div>
  </div>

  <div class="overlay" id="overOverlay" hidden>
    <h1>Game Over</h1>
    <div class="big-score" id="finalScore">0</div>
    <div class="new-best" id="newBest" hidden>★ New best score ★</div>
    <button class="btn" id="retryBtn">Play again</button>
    <div class="keys"><kbd>R</kbd> restart</div>
  </div>

  <div class="overlay" id="pauseOverlay" hidden>
    <h1>Paused</h1>
    <button class="btn" id="resumeBtn">Resume</button>
  </div>
</div>

<div class="dpad" aria-label="Touch controls">
  <button class="up" data-dir="up" aria-label="Up">▲</button>
  <button class="left" data-dir="left" aria-label="Left">◀</button>
  <button class="right" data-dir="right" aria-label="Right">▶</button>
  <button class="down" data-dir="down" aria-label="Down">▼</button>
</div>

<script>
(function () {
  'use strict';

  var GRID = 21;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var pauseOverlay = document.getElementById('pauseOverlay');
  var finalScoreEl = document.getElementById('finalScore');
  var newBestEl = document.getElementById('newBest');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var BEST_KEY = 'lab-snake-best';
  var best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  var snake, dir, nextDir, food, score, speed, state; // state: idle | run | pause | over
  var lastStep = 0, animId = null;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 150; // ms per step, decreases as you eat
    placeFood();
    scoreEl.textContent = '0';
  }

  function placeFood() {
    while (true) {
      var x = Math.floor(Math.random() * GRID);
      var y = Math.floor(Math.random() * GRID);
      var onSnake = snake.some(function (s) { return s.x === x && s.y === y; });
      if (!onSnake) { food = { x: x, y: y }; return; }
    }
  }

  function step() {
    dir = nextDir;
    var head = { x: (snake[0].x + dir.x + GRID) % GRID, y: (snake[0].y + dir.y + GRID) % GRID };

    if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }
    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.max(70, speed - 4);
      beep(520, 0.07, 'square', 0.05);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    beep(160, 0.35, 'sawtooth', 0.07);
    finalScoreEl.textContent = score;
    var isBest = score > best;
    if (isBest) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    newBestEl.hidden = !isBest;
    overOverlay.hidden = false;
  }

  function draw() {
    var w = canvas.width, h = canvas.height;
    var cell = w / GRID;
    ctx.fillStyle = '#0e1116';
    ctx.fillRect(0, 0, w, h);

    // subtle checkerboard
    ctx.fillStyle = 'rgba(255,255,255,.018)';
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    // food
    if (food) {
      var pulse = reduceMotion ? 1 : 1 + Math.sin(Date.now() / 200) * 0.12;
      var fr = cell * 0.32 * pulse;
      ctx.save();
      ctx.shadowColor = '#ff5470'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff5470';
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, fr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // snake
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = i / Math.max(snake.length - 1, 1);
      var lightness = 58 - t * 26;
      ctx.fillStyle = 'hsl(152, 68%, ' + lightness + '%)';
      if (i === 0) {
        ctx.save();
        ctx.shadowColor = '#3ddc97'; ctx.shadowBlur = 16;
      }
      roundRect(ctx, s.x * cell + 1.5, s.y * cell + 1.5, cell - 3, cell - 3, cell * 0.28);
      ctx.fill();
      if (i === 0) ctx.restore();
    }

    // eyes on the head
    var hd = snake[0];
    var cx = hd.x * cell + cell / 2, cy = hd.y * cell + cell / 2;
    var ex = dir.y !== 0 ? cell * 0.18 : 0, ey = dir.x !== 0 ? cell * 0.18 : 0;
    var ox = dir.x * cell * 0.1, oy = dir.y * cell * 0.1;
    ctx.fillStyle = '#06281b';
    ctx.beginPath();
    ctx.arc(cx + ox + (ex || 0) + (dir.x ? 0 : cell * 0.0), cy + oy + (ey || 0), cell * 0.08, 0, Math.PI * 2);
    ctx.arc(cx + ox - (ex || 0), cy + oy - (ey || 0), cell * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function loop(now) {
    animId = requestAnimationFrame(loop);
    if (state !== 'run') return;
    if (now - lastStep >= speed) {
      lastStep = now;
      step();
    }
    draw();
  }

  // ---------- sound ----------
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- input ----------
  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  function setDir(name) {
    var d = DIRS[name];
    if (!d) return;
    // no reversing into yourself
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  var KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
  };
  document.addEventListener('keydown', function (e) {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      if (state === 'idle') startGame();
      setDir(KEYMAP[e.key]);
    } else if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      togglePause();
    } else if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && state === 'over') {
      startGame();
    }
  });

  // swipe
  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (!touchStart) return;
    var dx = e.touches[0].clientX - touchStart.x;
    var dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touchStart = null;
  }, { passive: true });

  // d-pad
  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (btn) {
    btn.addEventListener('pointerdown', function () {
      if (state === 'idle') startGame();
      setDir(btn.getAttribute('data-dir'));
    });
  });

  // ---------- flow ----------
  function startGame() {
    reset();
    state = 'run';
    lastStep = performance.now();
    startOverlay.hidden = true;
    overOverlay.hidden = true;
    pauseOverlay.hidden = true;
    document.getElementById('pauseBtn').textContent = '⏸';
  }
  function togglePause() {
    if (state === 'run') {
      state = 'pause';
      pauseOverlay.hidden = false;
      document.getElementById('pauseBtn').textContent = '▶';
    } else if (state === 'pause') {
      state = 'run';
      lastStep = performance.now();
      pauseOverlay.hidden = true;
      document.getElementById('pauseBtn').textContent = '⏸';
    }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('pauseBtn').addEventListener('click', function () {
    if (state === 'run' || state === 'pause') togglePause();
  });
  document.getElementById('muteBtn').addEventListener('click', function () {
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- sizing ----------
  function resize() {
    var rect = canvas.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    if (snake) draw();
  }
  window.addEventListener('resize', resize);

  // ---------- boot ----------
  reset();
  state = 'idle';
  resize();
  requestAnimationFrame(loop);
  draw();
})();
</script>
<a href="../../index.html" id="lab-back" aria-label="Back to all experiments">&#9666; All experiments</a>
<style>
#lab-back{position:fixed;left:14px;bottom:14px;z-index:2147483000;padding:8px 14px 9px;border-radius:999px;
background:rgba(16,16,22,.72);color:#e2e6e3;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.05em;
text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.14);opacity:.55;transition:opacity .2s,background .2s,color .2s,transform .2s}
#lab-back:hover,#lab-back:focus-visible{opacity:1;background:#711BFF;color:#fff;transform:translateY(-1px);outline:none}
@media (prefers-reduced-motion:reduce){#lab-back{transition:none}}
</style>
</body>
</html>

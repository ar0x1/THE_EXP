<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Reward 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #243b55, #141e30 70%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Montserrat', sans-serif; color: #fff; text-align: center; padding: 24px;
    }
    .card { animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    img {
      max-width: min(80vw, 460px); width: 100%; border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
      margin-bottom: 26px;
    }
    h1 { font-size: clamp(24px, 5vw, 40px); font-weight: 900; margin: 0 0 10px; }
    p { font-size: clamp(15px, 2.4vw, 20px); opacity: .75; margin: 0 0 28px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 13px 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.07); color: #fff; font: 600 15px 'Montserrat', sans-serif;
      cursor: pointer; text-decoration: none; transition: background .2s, transform .2s;
    }
    .btn:hover, .btn:focus-visible { background: rgba(255,255,255,.16); transform: translateY(-1px); outline: none; }
    .btn.primary { background: #711BFF; border-color: #711BFF; }
    .btn.primary:hover, .btn.primary:focus-visible { background: #8a4bff; }
    @keyframes pop { from { opacity: 0; transform: scale(.7) translateY(30px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <div class="card">
    <img src="reward.svg" alt="A grinning cat in a party hat popping out of a gift box — you've been pranked">
    <h1>You've been pranked! 🎉</h1>
    <p>There was never a prize. There never is.</p>
    <div class="actions">
      <button class="btn primary" id="soundBtn">🔊 Play the sound of shame</button>
      <a class="btn" href="index.html">Prank someone else</a>
    </div>
  </div>

  <audio id="prankSound" loop preload="auto">
    <source src="sound.mp3" type="audio/mpeg">
  </audio>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    var audio = document.getElementById('prankSound');
    var btn = document.getElementById('soundBtn');
    var playing = false;

    // Try autoplay; browsers will usually block it — the button is the honest fallback.
    audio.play().then(function () { playing = true; btn.textContent = '🔇 Mute the shame'; }).catch(function () {});

    btn.addEventListener('click', function () {
      if (playing) { audio.pause(); btn.textContent = '🔊 Play the sound of shame'; }
      else { audio.play(); btn.textContent = '🔇 Mute the shame'; }
      playing = !playing;
    });

    // Confetti celebration (only if the library loaded and motion is welcome)
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (window.confetti && !reduceMotion) {
      var bursts = 0;
      var timer = setInterval(function () {
        confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 } });
        if (++bursts >= 4) clearInterval(timer);
      }, 650);
    }
  </script>
<a href="../../index.html" id="lab-back" aria-label="Back to all experiments">&#9666; All experiments</a>
<style>
#lab-back{position:fixed;left:14px;bottom:14px;z-index:2147483000;padding:8px 14px 9px;border-radius:999px;
background:rgba(16,16,22,.72);color:#e2e6e3;font:500 12px/1 system-ui,-apple-system,sans-serif;letter-spacing:.05em;
text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.14);opacity:.55;transition:opacity .2s,background .2s,color .2s,transform .2s}
#lab-back:hover,#lab-back:focus-visible{opacity:1;background:#711BFF;color:#fff;transform:translateY(-1px);outline:none}
@media (prefers-reduced-motion:reduce){#lab-back{transition:none}}
</style>
</body>
</html>
